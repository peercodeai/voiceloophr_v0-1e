version: 1
frontend:
  phases:
    preBuild:
      commands:
        - echo "Installing dependencies with npm..."
        - npm ci
    build:
      commands:
        - echo "Building application with npm..."
        - npm run build
  artifacts:
    baseDirectory: .next
    files:
      - '**/*'
  cache:
    paths:
      - node_modules/**/*
      - .next/cache/**/*
      - package-lock.json
