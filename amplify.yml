version: 1
frontend:
  phases:
    preBuild:
      commands:
        - echo "Installing dependencies with npm..."
        - rm -rf node_modules package-lock.json
        - npm install
    build:
      commands:
        - echo "Building application with npm..."
        - export NEXT_TELEMETRY_DISABLED=1
        - export npm_config_registry=https://registry.npmjs.org/
        - export NPM_CONFIG_REGISTRY=https://registry.npmjs.org/
        - npm run build
  artifacts:
    baseDirectory: .next
    files:
      - '**/*'
  cache:
    paths:
      - .next/cache/**/*
